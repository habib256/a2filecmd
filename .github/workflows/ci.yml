name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Each CPU ships BOOT, EXTRA and EXTRA2 floppies plus a complete XL 2mg.
# cc65 master provides the 6502 console; cc65 2.19 builds apple2enh.
env:
  CC65_HEAD_COMMIT: e11fb5c

jobs:
  build:
    name: cc65, budgets memoire, images disque (65C02 et 6502)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer cc65 2.19
        run: |
          # cc65 comes from Ubuntu; unrelated preinstalled Chrome/Microsoft
          # repositories must not prevent refreshing its package index.
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- update
          sudo apt-get install -y cc65
          cl65 --version 2>&1 | head -1

      - name: cc65 master, pour la version 6502 (cache)
        id: cc65head
        uses: actions/cache@v4
        with:
          path: ~/opt/cc65-head
          key: cc65-head-${{ env.CC65_HEAD_COMMIT }}-${{ runner.os }}

      - name: Construire cc65 master
        if: steps.cc65head.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/cc65/cc65.git /tmp/cc65-head
          cd /tmp/cc65-head && git checkout -q ${{ env.CC65_HEAD_COMMIT }}
          make -j"$(nproc)" > /dev/null
          make install PREFIX="$HOME/opt/cc65-head" > /dev/null
          "$HOME/opt/cc65-head/bin/cl65" --version 2>&1 | head -1

      # Les tests qui ne demandent pas de machine Apple II : le contrat de
      # disposition memoire, l'ecrivain de volume ProDOS et son aller-retour,
      # les fichiers de demonstration relus comme le programme les lit.
      - name: Tests hors emulateur
        run: make test

      # Le lien echoue si le code passe sous le plancher de la pile C ou si
      # la coupe du fichier ne correspond plus au lanceur : check_layout.py
      # tourne dans la recette, pas apres coup.
      - name: BOOT, EXTRA, EXTRA2 et XL pour chaque processeur
        run: make disk && make xplugins ARCH=6502

      - name: Relire les huit volumes et verifier leurs surcouches
        run: python3 tools/check_images.py

      - name: Empreintes et notes de version
        run: |
          VERSION=$(sed -n 's/^A2FC_VERSION *= *//p' Makefile)
          cp docs/A2FILECMD-MANUAL-EN.pdf "dist/A2FILECMD-MANUAL-EN-$VERSION.pdf"
          cd dist && sha256sum A2FILECMD-*-BOOT-*.dsk A2FILECMD-*-EXTRA-*.dsk A2FILECMD-*-EXTRA2-*.dsk A2FILECMD-*-XL-*.2mg "A2FILECMD-MANUAL-EN-$VERSION.pdf" | tee "SHA256SUMS-$VERSION.txt"
          cd .. && python3 tools/release_notes.py "${GITHUB_REF_NAME}" > dist/RELEASE_NOTES.md

      - name: Les cartes memoire, pour le journal de construction
        run: |
          for b in build build-6502; do
            echo "## Disposition ($b)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -n '/^Name  *Start/,/^LC /p' $b/a2fc.map >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          python3 tools/prodos_read.py dist/A2FILECMD-6502-BOOT-*.po >> $GITHUB_STEP_SUMMARY

      # Les images seules : tous les chemins sous dist/, dont
      # upload-artifact retire le prefixe commun -- le telechargement du
      # travail de publication les remet dans dist/ et les trouve la. Y
      # mêler build/*.map ferait un artefact a deux racines, donc des
      # fichiers en dist/dist/ a la publication.
      - uses: actions/upload-artifact@v4
        with:
          name: a2filecmd-disk
          path: |
            dist/
            !dist/*.po

      - uses: actions/upload-artifact@v4
        with:
          name: a2filecmd-maps
          path: |
            build/*.map
            build-6502/*.map

  # Les bancs jouent une session complete dans POM2 sans fenetre, sur les
  # deux versions. L'emulateur n'est pas sur les executeurs de GitHub ;
  # declarez la variable de depot POM2_RUNNER (l'etiquette d'un executeur
  # auto-heberge qui a POM2 et un cc65 master dans ~/opt/cc65-head) pour que
  # ce travail tourne. Voir bench/README.md.
  bench:
    name: bancs POM2 (executeur auto-heberge)
    needs: build
    if: ${{ vars.POM2_RUNNER != '' }}
    runs-on: ${{ vars.POM2_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - run: make disk && make benchfloppy ARCH=enh
      - name: Les deux disquettes BOOT publiees demarrent
        run: |
          A2FC_PRESET=iie_unenh python3 bench/smoke.py
          A2FC_IMG=A2FILECMD-65C02-BOOT python3 bench/smoke.py
      - name: Complement, deux lecteurs et echanges sur un lecteur
        run: |
          A2FC_PRESET=iie_unenh python3 bench/extras.py
          A2FC_IMG=A2FILECMD-65C02-BOOT python3 bench/extras.py
      - name: Six nouveaux plugins sur les deux CPU
        run: |
          A2FC_PRESET=iie_unenh python3 bench/six.py
          A2FC_IMG=A2FILECMD-65C02-BOOT python3 bench/six.py
          A2FC_PRESET=iie_unenh python3 bench/disksingle.py
      - name: VOLINFO, diagnostic en lecture seule sur les deux CPU
        run: |
          A2FC_PRESET=iie_unenh python3 bench/tree.py
          A2FC_IMG=A2FILECMD-65C02-BOOT python3 bench/tree.py
          A2FC_PRESET=iie_unenh python3 bench/blocktools.py
          A2FC_IMG=A2FILECMD-65C02-BOOT python3 bench/blocktools.py
          A2FC_PRESET=iie_unenh python3 bench/volinfo.py
          A2FC_IMG=A2FILECMD-65C02-BOOT python3 bench/volinfo.py
      - name: FORMAT, protections et retour resident sur les deux CPU
        run: |
          A2FC_PRESET=iie_unenh python3 bench/format.py
          A2FC_IMG=A2FILECMD-65C02-BOOT python3 bench/format.py
      - name: Session complete, 65C02 (disquette de banc, toutes les surcouches)
        run: A2FC_IMG=A2FILECMD-full python3 bench/run.py --out bench-out
      - name: Les deux disques XL publies
        run: |
          A2FC_CPU=6502 A2FC_PRESET=iie_unenh python3 bench/hd.py
          python3 bench/hd.py
      - name: Nouvelles surcouches, IIe non enhanced
        run: |
          make xplugins ARCH=6502
          A2FC_PRESET=iie_unenh python3 bench/plugins.py --out bench-out/plugins-6502
      - name: Nouvelles surcouches, 65C02
        run: A2FC_BUILD=build python3 bench/plugins.py --out bench-out/plugins-enh
      - name: Budget de pile
        run: A2FC_IMG=A2FILECMD-full python3 bench/memory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2filecmd-bench
          path: bench-out

  release:
    name: publication
    needs: [build, bench]
    if: startsWith(github.ref, 'refs/tags/v') && always() && needs.build.result == 'success' && needs.bench.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: a2filecmd-disk
          path: dist
      - name: Ce qui va etre publie
        run: |
          ls -l dist
          cd dist && sha256sum -c SHA256SUMS-*.txt   # des noms nus : se verifie depuis dist/
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV   # le titre porte 0.6.8, pas v0.6.8
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          name: "A2 File Cmd ${{ env.VERSION }} — Two panels. One Apple II."
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/A2FILECMD-*-BOOT-*.dsk
            dist/A2FILECMD-*-EXTRA-*.dsk
            dist/A2FILECMD-*-EXTRA2-*.dsk
            dist/A2FILECMD-*-XL-*.2mg
            dist/A2FILECMD-MANUAL-EN-*.pdf
            dist/SHA256SUMS-*.txt
