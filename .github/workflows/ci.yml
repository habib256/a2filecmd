name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Five images: 140K, 800K, Mini, XL 6502 and XL 65C02-enhanced.
# cc65 master provides the 6502 console; cc65 2.19 builds apple2enh.
env:
  CC65_HEAD_COMMIT: e11fb5c

jobs:
  build:
    name: cc65, budgets memoire, images disque (65C02 et 6502)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier la version du tag avant construction
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/release_notes.py --check-tag "$GITHUB_REF_NAME"

      - name: Installer cc65 2.19
        run: |
          # cc65 comes from Ubuntu; unrelated preinstalled Chrome/Microsoft
          # repositories must not prevent refreshing its package index.
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- update
          sudo apt-get install -y cc65 ncompress
          cl65 --version 2>&1 | head -1

      - name: cc65 master, pour la version 6502 (cache)
        id: cc65head
        uses: actions/cache@v4
        with:
          path: ~/opt/cc65-head
          key: cc65-head-${{ env.CC65_HEAD_COMMIT }}-${{ runner.os }}

      - name: Construire cc65 master
        if: steps.cc65head.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/cc65/cc65.git /tmp/cc65-head
          cd /tmp/cc65-head && git checkout -q ${{ env.CC65_HEAD_COMMIT }}
          make -j"$(nproc)" > /dev/null
          make install PREFIX="$HOME/opt/cc65-head" > /dev/null
          "$HOME/opt/cc65-head/bin/cl65" --version 2>&1 | head -1

      # Les tests qui ne demandent pas de machine Apple II : le contrat de
      # disposition memoire, l'ecrivain de volume ProDOS et son aller-retour,
      # les fichiers de demonstration relus comme le programme les lit.
      - name: Tests hors emulateur
        run: make test

      # Le lien echoue si le code passe sous le plancher de la pile C ou si
      # la coupe du fichier ne correspond plus au lanceur : check_layout.py
      # tourne dans la recette, pas apres coup.
      - name: Cinq images de distribution
        run: make disk && make xplugins ARCH=6502

      - name: Relire les cinq images et verifier leurs surcouches
        run: python3 tools/check_images.py

      - name: Empreintes et notes de version
        run: |
          VERSION=$(sed -n 's/^A2FC_VERSION *= *//p' Makefile)
          cp docs/A2FILECMD-MANUAL-EN.pdf "dist/A2FILECMD-MANUAL-EN-$VERSION.pdf"
          python3 tools/release_assets.py
          python3 tools/release_notes.py "${GITHUB_REF_NAME}" > dist/RELEASE_NOTES.md

      - name: Les cartes memoire, pour le journal de construction
        run: |
          for b in build build-6502; do
            echo "## Disposition ($b)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -n '/^Name  *Start/,/^LC /p' $b/a2fc.map >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          python3 tools/prodos_read.py dist/A2FILECMD-140K-*.po >> $GITHUB_STEP_SUMMARY

      # Les images seules : tous les chemins sous dist/, dont
      # upload-artifact retire le prefixe commun -- le telechargement du
      # travail de publication les remet dans dist/ et les trouve la. Y
      # mêler build/*.map ferait un artefact a deux racines, donc des
      # fichiers en dist/dist/ a la publication.
      - uses: actions/upload-artifact@v4
        with:
          name: a2filecmd-disk
          path: |
            dist/A2FILECMD-140K-[0-9].*.dsk
            dist/A2FILECMD-800K-[0-9].*.po
            dist/A2FILECMD-DOS3.3-[0-9].*.dsk
            dist/A2FILECMD-XL-[0-9].*.2mg
            dist/A2FILECMD-XL-65C02-enhanced-[0-9].*.2mg
            dist/A2FILECMD-MANUAL-EN-*.pdf
            dist/SHA256SUMS-*.txt
            dist/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: a2filecmd-maps
          path: |
            build/*.map
            build-6502/*.map

  # Les bancs jouent une session complete dans POM2 sans fenetre, sur les
  # deux versions. L'emulateur n'est pas sur les executeurs de GitHub ;
  # declarez la variable de depot POM2_RUNNER (l'etiquette d'un executeur
  # auto-heberge qui a POM2 et un cc65 master dans ~/opt/cc65-head) pour que
  # ce travail tourne. Voir bench/README.md.
  #
  # La liste des bancs et la machine de chacun sont dans bench/all.py, une
  # seule fois : ces etapes en jouent les groupes, et la qualification d'une
  # version rejoue la meme table (python3 bench/all.py --strict). Un banc qui
  # n'est dans aucun groupe fait echouer make test.
  bench:
    name: bancs POM2 (executeur auto-heberge)
    needs: build
    if: ${{ vars.POM2_RUNNER != '' }}
    runs-on: ${{ vars.POM2_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - run: make disk && make benchfloppy ARCH=enh && make benchfloppy ARCH=6502 && make xplugins ARCH=6502 && make benchpackages ARCH=6502
      - name: Amorcage des disquettes publiees et noyau des surcouches
        run: python3 bench/all.py --setup --strict --out bench-out --group boot core
      - name: DOS 3.3 physique, images et nibbles ; ce qui ne doit perdre aucun octet
        run: python3 bench/all.py --setup --strict --out bench-out --group dos safety
      - name: Session complete, enchainements et disques XL publies
        run: python3 bench/all.py --strict --out bench-out --group session xl
      - name: Surcouches a table de services, deux processeurs
        run: python3 bench/all.py --strict --out bench-out --group plugins
      - name: Lecteurs, archives, images et sons
        run: python3 bench/all.py --setup --out bench-out --group readers archives media
      - name: Cartes, ligne serie et edition Apple II+
        run: python3 bench/all.py --setup --out bench-out --group cards mini
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2filecmd-bench
          path: bench-out

  release:
    name: publication
    needs: [build, bench]
    if: startsWith(github.ref, 'refs/tags/v') && always() && needs.build.result == 'success' && (needs.bench.result == 'success' || needs.bench.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: a2filecmd-disk
          path: dist
      - name: Ce qui va etre publie
        run: |
          ls -l dist
          cd dist && sha256sum -c SHA256SUMS-*.txt   # des noms nus : se verifie depuis dist/
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV   # le titre porte 0.6.8, pas v0.6.8
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          name: "A2 File Cmd ${{ env.VERSION }} — Two panels. One Apple II."
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/A2FILECMD-140K-[0-9].*.dsk
            dist/A2FILECMD-800K-[0-9].*.po
            dist/A2FILECMD-DOS3.3-[0-9].*.dsk
            dist/A2FILECMD-XL-[0-9].*.2mg
            dist/A2FILECMD-XL-65C02-enhanced-[0-9].*.2mg
            dist/A2FILECMD-MANUAL-EN-*.pdf
            dist/SHA256SUMS-*.txt
