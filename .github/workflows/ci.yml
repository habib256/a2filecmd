name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: cc65, budgets memoire, images disque
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer cc65
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65
          cl65 --version 2>&1 | head -1

      # Les tests qui ne demandent pas de machine Apple II : le contrat de
      # disposition memoire, l'ecrivain de volume ProDOS et son aller-retour,
      # les fichiers de demonstration relus comme le programme les lit.
      - name: Tests hors emulateur
        run: make test

      # Le lien echoue si le code passe sous le plancher de la pile C ou si
      # la coupe du fichier ne correspond plus au lanceur : check_layout.py
      # tourne dans la recette, pas apres coup.
      - name: Construire les trois binaires ProDOS
        run: make all

      - name: Construire la disquette .po et .dsk
        run: make disk

      - name: Relire l'image produite
        run: |
          python3 tools/prodos_read.py dist/A2FILECMD.po
          test "$(stat -c%s dist/A2FILECMD.po)" = 143360
          test "$(stat -c%s dist/A2FILECMD.dsk)" = 143360
          python3 tools/po2dsk.py dist/A2FILECMD.po /tmp/again.dsk
          cmp /tmp/again.dsk dist/A2FILECMD.dsk

      - name: Empreintes
        run: |
          cd dist && sha256sum A2FILECMD.po A2FILECMD.dsk | tee SHA256SUMS.txt

      - name: La carte memoire, pour le journal de construction
        run: |
          echo '## Disposition' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '/^Name  *Start/,/^LC /p' build/a2fc.map >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 tools/prodos_read.py dist/A2FILECMD.po >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: a2filecmd-disk
          path: |
            dist/A2FILECMD.po
            dist/A2FILECMD.dsk
            dist/SHA256SUMS.txt
            build/a2fc.map
            build/A2FILE.CODE.BIN
            build/A2FILE.SYSTEM.SYS
            build/FORMAT.SYS.SYS

  # Les bancs jouent une session complete dans POM2 sans fenetre : navigation,
  # copie, deplacement, edition, images comparees octet a octet, formatage,
  # Applesoft. L'emulateur n'est pas sur les executeurs de GitHub ; declarez la
  # variable de depot POM2_RUNNER (l'etiquette d'un executeur auto-heberge qui
  # a POM2) pour que ce travail tourne. Voir bench/README.md.
  bench:
    name: bancs POM2 (executeur auto-heberge)
    needs: build
    if: ${{ vars.POM2_RUNNER != '' }}
    runs-on: ${{ vars.POM2_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - run: make all disk
      - name: Session complete
        run: python3 bench/run.py --out bench-out
      - name: Budget de pile
        run: python3 bench/memory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a2filecmd-bench
          path: bench-out

  release:
    name: publication
    needs: [build, bench]
    if: startsWith(github.ref, 'refs/tags/v') && always() && needs.build.result == 'success' && needs.bench.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: a2filecmd-disk
          path: dist
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/A2FILECMD.po
            dist/A2FILECMD.dsk
            dist/SHA256SUMS.txt
          body_path: docs/RELEASE.md
