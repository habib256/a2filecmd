# PT3 code/BSS $1B00-$36FF, headers $3700-$3AFF, initial cache $3B00-$3DFF.
# Second tone/volume tables $3E00-$3FBF; first tables use api->copy_buf.
# After initialization, reclaim two linker-checked init pages and unused
# header pages: 5-8 cache pages. No heap or private C stack.
#
# GROUiK's driver (ppt3/hook.s and ppt3/driver.s, included by pt3.s, segments PG*)
# is linked at $3B00-$3FBF, over pt3_lib's initial cache and second tables:
# the file therefore carries the window and the header pages as padding, and
# the driver after them (9,408 bytes at most, within OVERLAY_LARGE). Until
# the engine is chosen nothing writes $3B00-$3FBF (the scan uses SECOND);
# once pt3_lib starts, its caches overwrite the driver, which no longer runs.
# A big overlay is reloaded on every run, so the driver is always fresh.
# $3FC0-$3FFF: pt3_lib's zero-page copies (pt3.s host_zp/song_zp), free
# whichever player runs; not part of the file.
FEATURES { STARTADDRESS: default = $1B00; }
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0000;
    __STACKSTART__: type = weak, value = $0000;
}
MEMORY {
    ZP: file = "", define = yes, start = $0080, size = $001A;
    RAM: file = %O, start = $1B00, size = $1C00, fill = yes;
    HEADERS: file = %O, start = $3700, size = $0400, fill = yes;
    PG: file = %O, start = $3B00, size = $04C0;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    OVLHDR: load = RAM, type = ro;
    CODE: load = RAM, type = ro;
    RODATA: load = RAM, type = ro, optional = yes;
    DATA: load = RAM, type = rw, optional = yes;
    BSS: load = RAM, type = bss, optional = yes, define = yes;
    PGCODE: load = PG, type = ro;
    PGRODATA: load = PG, type = ro, optional = yes;
    PGBSS: load = PG, type = bss, optional = yes, define = yes;
}
