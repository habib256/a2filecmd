# PT3 code and BSS: $1B00-$32FF. Header: $3300-$34FF; cache: $3500-$3FFF.
# Eleven 256-byte cache pages address read-only modules up to 65535 bytes.
# Tone/volume tables borrow api->copy_buf; file reads use only header/cache.
# No auxiliary memory, heap or private C stack.
FEATURES { STARTADDRESS: default = $1B00; }
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0000;
    __STACKSTART__: type = weak, value = $0000;
}
MEMORY {
    ZP: file = "", define = yes, start = $0080, size = $001A;
    RAM: file = %O, start = $1B00, size = $1800;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    OVLHDR: load = RAM, type = ro;
    CODE: load = RAM, type = ro;
    RODATA: load = RAM, type = ro, optional = yes;
    DATA: load = RAM, type = rw, optional = yes;
    BSS: load = RAM, type = bss, optional = yes, define = yes;
}
