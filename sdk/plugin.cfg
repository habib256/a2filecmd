# sdk/plugin.cfg -- linking a THIRD-PARTY overlay for A2 File Cmd.
#
# An overlay is a BIN loaded by A2FC at $1B00 (the "overlay window"),
# recognised by its first eight bytes (struct Overlay, src/a2fc_plugin.h)
# and launched at its entry point with the service table (struct A2fcApi).
# A third-party overlay signs with PLUGIN_MAGIC and touches the program
# ONLY through that table: it knows no address of A2FC, so it is linked
# neither with crt0 nor with A2FILE.CODE. This file places it alone at
# $1B00, the header first.
#
# Small overlay: $1B00-$1FFF, 1,280 bytes. A big one also takes $2000-$3FFF
# (flag OVERLAY_BIG); raise RAM to size = $2500 in that case.
#
# The BSS is in the window, after the DATA, but NOTHING zeroes it: an
# overlay must therefore NOT rely on an uninitialised static being zero
# (the few bytes cc65 puts there for its temporaries are written before
# being read, so they are safe). For state, an overlay takes the buffers
# of the table (api->copy_buf, api->input) or the C stack, which A2FC
# already maintains; an INITIALISED static (DATA) is loaded from the file
# and will do.
#
# Link:  ld65 -C sdk/plugin.cfg -o NAME.PLG hdr.o plugin.o apple2enh.lib
# (see sdk/build.sh). The C stack, the cc65 zero page and the support
# functions (multiplication, sprintf...) come from the same apple2enh target
# as A2FC: their zero-page addresses coincide, and the overlay runs in the
# cc65 context already in place.

FEATURES {
    STARTADDRESS: default = $1B00;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0000;
    __STACKSTART__: type = weak, value = $0000;
}
MEMORY {
    ZP:   file = "",  define = yes, start = $0080, size = $001A;
    RAM:  file = %O,                start = $1B00, size = $0500;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    OVLHDR:   load = RAM, type = ro;                       # the header, first
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro,  optional = yes;
    DATA:     load = RAM, type = rw,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes, define = yes;   # not zeroed
}
