# sdk/plugin.cfg -- lier une surcouche d'un TIERS pour A2 File Cmd.
#
# Une surcouche est un BIN chargé par A2FC en $1B00 (la « fenêtre de
# surcouche »), reconnu par ses huit premiers octets (struct Overlay,
# src/a2fc_plugin.h) et lancé à son point d'entrée avec la table de services
# (struct A2fcApi). Une surcouche d'un tiers signe PLUGIN_MAGIC et ne touche
# au programme QUE par cette table : elle ne connaît aucune adresse d'A2FC,
# donc n'est liée ni avec crt0 ni avec A2FILE.CODE. Ce fichier la place seule
# en $1B00, l'en-tête en tête.
#
# Petite surcouche : $1B00-$1FFF, 1 280 octets. Une grande prend aussi
# $2000-$3FFF (drapeau OVERLAY_BIG) ; monter RAM à size = $2500 alors.
#
# Le BSS est dans la fenêtre, après le DATA, mais RIEN ne le met à zéro :
# une surcouche ne doit donc PAS compter sur une statique non initialisée
# valant zéro (les quelques octets que cc65 y pose pour ses temporaires, lui,
# sont écrits avant d'être lus, donc sans risque). Pour de l'état, une
# surcouche prend les tampons de la table (api->copy_buf, api->input) ou la
# pile C, qu'A2FC tient déjà ; une statique INITIALISÉE (DATA) est chargée
# depuis le fichier et convient.
#
# Lien :  ld65 -C sdk/plugin.cfg -o NOM.PLG hdr.o plugin.o apple2enh.lib
# (voir sdk/build.sh). La pile C, le zéro-page cc65 et les fonctions d'appui
# (multiplication, sprintf...) viennent de la même cible apple2enh qu'A2FC :
# leurs adresses zéro-page coïncident, et la surcouche tourne dans le
# contexte cc65 déjà en place.

FEATURES {
    STARTADDRESS: default = $1B00;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0000;
    __STACKSTART__: type = weak, value = $0000;
}
MEMORY {
    ZP:   file = "",  define = yes, start = $0080, size = $001A;
    RAM:  file = %O,                start = $1B00, size = $0500;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    OVLHDR:   load = RAM, type = ro;                       # l'en-tête, en premier
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro,  optional = yes;
    DATA:     load = RAM, type = rw,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes, define = yes;   # non remis à zéro
}
