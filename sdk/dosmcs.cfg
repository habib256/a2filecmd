# DOSMCS/MCSIMPORT: read-only preflight/decoder with a relocated handoff.
# Code/data must remain below $3700, where the canonical song is written.
# MCSHANDOFF is loaded with the overlay and copied to $0C00 only after the
# C entry has returned. BSS follows it, with ld65 bounding both below $1000.
# This is the ProDOS buffer of a SECOND open FILE: directory services are
# closed first and only one source/stage FILE is ever open (buffer $0800).
# A source image closes before a stage opens; the stage closes before its
# checked entry is called. No old overlay code/cc65 helper is executed once
# the new stage overwrites $1B00. AUX and the resident ABI are unchanged.

FEATURES {
    STARTADDRESS: default = $1B00;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0000;
    __STACKSTART__: type = weak, value = $0000;
    __OVLSIZE__:    type = weak, value = $1C00;
}
MEMORY {
    ZP:   file = "",  define = yes, start = $0080, size = $001A;
    LOW:  file = "", define = yes, start = $0C00, size = $0400;
    RAM:  file = %O,                start = $1B00, size = __OVLSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    OVLHDR:   load = RAM, type = ro;                       # the header, first
    MCSHANDOFF: load = RAM, run = LOW, type = rw, define = yes;
    CODE:     load = RAM, type = ro;
    LOOP:     load = RAM, type = ro,  optional = yes, align = $80;   # a cycle-counted loop kept inside one page
    RODATA:   load = RAM, type = ro,  optional = yes;
    DATA:     load = RAM, type = rw,  optional = yes;
    BSS:      load = LOW, type = bss, optional = yes, define = yes;   # not zeroed
}
