# sdk/gmagic.cfg -- GMAGIC (src/plugins/gmagic.s), a big overlay that
# draws on hi-res page 1 and needs more code than the $1B00-$1FFF window.
#
# The core loads a big overlay's whole file from $1B00, up to $3FFF. Here
# the file is the window $1B00-$1FFF, filled to its end, then two parts
# loaded into the graphics page and moved off it before the page is
# cleared there:
#   COLD   runs in place at $2000: the entry point and the checks of every
#          picture, which jump to CODE for good before the page is cleared;
#   GMLOW  copied by the entry to $0C00-$0FFF and run there, with the BSS
#          (GMBSS) after it: the copy is whole pages, so the entry writes
#          nothing there before it. $0C00 is the ProDOS buffer of a SECOND open file
#          (src/a2fc.cfg, MAPRAM): GMAGIC never keeps two open.
# ld65 refuses a window, a COLD part or a GMLOW + BSS that overflows.
FEATURES {
    STARTADDRESS: default = $1B00;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0000;
    __STACKSTART__: type = weak, value = $0000;
    __OVLSIZE__:    type = weak, value = $0500;     # the Makefile passes one; unused
}
MEMORY {
    ZP:   file = "",  define = yes, start = $0080, size = $001A;
    RAM:  file = %O,                start = $1B00, size = $0500, fill = yes;
    HGR:  file = %O,                start = $2000, size = $2000;
    LOW:  file = "",  define = yes, start = $0C00, size = $0400;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    OVLHDR:   load = RAM, type = ro;                       # the header, first
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro,  optional = yes;
    DATA:     load = RAM, type = rw,  optional = yes;
    COLD:     load = HGR, type = ro;
    GMLOW:    load = HGR, run = LOW, type = ro, define = yes;
    GMBSS:    load = LOW, type = bss, define = yes;   # not zeroed; set once GMLOW is copied
    BSS:      load = LOW, type = bss, optional = yes;
}
