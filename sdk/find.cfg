# FIND: setup UI occupies the future directory queue, and is never called
# after read_pattern returns. Fill RAM so the ordinary linear overlay loader
# places SETUP at $3100. Resident code AND BSS must stay below that address.
FEATURES { STARTADDRESS: default = $1B00; }
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0000;
    __STACKSTART__: type = weak, value = $0000;
}
MEMORY {
    ZP: file = "", define = yes, start = $0080, size = $001A;
    RAM: file = %O, start = $1B00, size = $1600, fill = yes;
    SETUP: file = %O, start = $3100, size = $0800;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    OVLHDR: load = RAM, type = ro;
    CODE: load = RAM, type = ro;
    RODATA: load = RAM, type = ro, optional = yes;
    DATA: load = RAM, type = rw, optional = yes;
    BSS: load = RAM, type = bss, optional = yes, define = yes;
    SETUPCODE: load = SETUP, type = ro;
    SETUPRODATA: load = SETUP, type = ro;
}
