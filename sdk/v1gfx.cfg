# Two phases: C overlaps the HGR page and returns before it is replaced.
# Only VGTAIL, its header and private state survive at $1B00-$1C9F.
# Staged pixels use AUX only after aux_consent; ram_format runs from VGTAIL.
MEMORY {
 ZP: file="", start=$0080, size=$001A;
 TAIL: file=%O, start=$1B00, size=$01A0, fill=yes;
 COLD: file=%O, start=$1CA0, size=$2360;
}
SEGMENTS {
 ZEROPAGE: load=ZP, type=zp, optional=yes;
 OVLHDR: load=TAIL, type=ro;
 VGTAIL: load=TAIL, type=ro;
 VGDATA: load=TAIL, type=rw;
 CODE: load=COLD, type=ro;
 RODATA: load=COLD, type=ro, optional=yes;
 DATA: load=COLD, type=rw, optional=yes;
 BSS: load=COLD, type=bss, define=yes;
}
SYMBOLS {
 __STACKSIZE__: type=weak, value=$0000;
 __STACKSTART__: type=weak, value=$0000;
}
