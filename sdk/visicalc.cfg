# sdk/visicalc.cfg -- VISICALC.PLG and its phases (src/plugins/visicalc.s).
#
# The overlay does not fit the big window in one piece: its code is cut in
# a part that stays ($1B00 on, with the header), and three phases that take
# turns at the same place, the swap area -- reading the worksheet (VCA,
# in VISICALC.PLG itself), recalculating it (VCB) and showing it (VCC),
# both in VISICALC.BIN beside it, VC_SWAP bytes each. The BSS and the
# cell table follow the swap area, up to $3FFF.
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0000;
    __STACKSTART__: type = weak, value = $0000;
    __OVLSIZE__:    type = weak, value = $2500;   # the Makefile's, unused here
    VC_KEEP:        type = export, value = $0B00; # the part that stays
    VC_SWAP:        type = export, value = $1000; # each phase
}
MEMORY {
    ZP:   file = "",       define = yes, start = $0080, size = $001A;
    RAM:  file = %O,       start = $1B00, size = VC_KEEP, fill = yes;
    SWA:  file = %O,       start = $1B00 + VC_KEEP, size = VC_SWAP;
    SWB:  file = "%O.BIN", start = $1B00 + VC_KEEP, size = VC_SWAP, fill = yes;
    SWC:  file = "%O.BIN", start = $1B00 + VC_KEEP, size = VC_SWAP, fill = yes;
    HIGH: file = "",       start = $1B00 + VC_KEEP + VC_SWAP, size = $2500 - VC_KEEP - VC_SWAP;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp,  optional = yes;
    OVLHDR:   load = RAM,  type = ro;
    CODE:     load = RAM,  type = ro,  define = yes;
    RODATA:   load = RAM,  type = ro,  optional = yes;
    DATA:     load = RAM,  type = rw,  optional = yes;
    VCA:      load = SWA,  type = ro,  define = yes;
    VCB:      load = SWB,  type = ro,  define = yes;
    VCC:      load = SWC,  type = ro,  define = yes;
    BSS:      load = HIGH, type = bss, define = yes;
}
