# TAKE1.SYSTEM -- the Take 1 player (src/take1/take1.s, dos.s, engine.s).
#
# A ProDOS interpreter: the file loads at $2000 (the LOADER segment, then
# the program to be moved) and moves TIMED and CODE to $0800, HICODE, RODATA and
# HIDATA to $B000 before anything else, since the three hi-res pages are
# needed. The LOADER code (the start, the command, the movie) runs once
# from page 1, with page 2 free for the loader's buffers.
#
#   $0060-$00DF  zero page
#   $0200-$03CF  variables (BSS); $0300-$03CF is the return thunk once
#                the program has stopped
#   $0800-$1FFF  the timed loops (TIMED, one page from $0800), the hooks,
#                the engine's code
#   $2000-$3FFF  hi-res page 1        $4000-$5FFF  hi-res page 2
#   $6000-$7FFF  page 3: the scene's background and its planted objects
#   $8000-$AFFF  the scene, its actors and character set (SCENE_MAX,
#                12,288 bytes); before them, at each scene, the movie
#                (its entry is kept) and the background (before it is
#                decoded into page 3)
#   $B000-$BEFF  the loader, the hooks, the engine's tables, variables
#                (HIBSS); $BB00-$BEFF is the return thunk's I/O buffer
#                once the program has stopped
#   $BF00        ProDOS global page, untouched
# While a file is read (between scenes), the page not shown holds the
# ProDOS I/O buffer (+$000), the block buffer (+$400), the T/S list
# (+$600) and the path (+$700): ProDOS reads only into the block buffer.
MEMORY {
    ZP:    file = "", start = $0060, size = $0080, type = rw;
    LOWB:  file = "", start = $0200, size = $01D0, type = rw;
    FILE:  file = %O, start = $2000, size = $6000;
    LOW:   file = "", start = $0800, size = $1800;
    HIGH:  file = "", start = $B000, size = $0F00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    LOADER:   load = FILE, type = ro, define = yes;
    TIMED:    load = FILE, run = LOW,  type = ro, define = yes;
    CODE:     load = FILE, run = LOW,  type = ro, define = yes;
    HICODE:   load = FILE, run = HIGH, type = ro, define = yes;
    RODATA:   load = FILE, run = HIGH, type = ro, define = yes;
    HIDATA:   load = FILE, run = HIGH, type = rw, define = yes;
    HIBSS:    load = HIGH, type = bss, define = yes;
    BSS:      load = LOWB, type = bss, define = yes;
}
