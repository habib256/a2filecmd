# FANTA.SYSTEM -- the Fantavision player (src/fanta/fanta.s, engine.s).
#
# A ProDOS interpreter: the file loads at $2000 (the LOADER segment, then
# the program to be moved) and moves CODE and RODATA to $A400 before
# anything else, since both hi-res pages are needed.
#
#   $0060-$00DF  zero page
#   $0300-$03CF  the return thunk, written there on the way out
#   $0800-$0BFF  ProDOS I/O buffer while the movie is read; then the
#                engine's erase extents (EBSS, set by fv_begin)
#   $0C00-$1FFF  variables (BSS), then the engine's tables and its
#                once-a-movie code (TABLES, FCOLD: copied by the loader)
#   $2000-$3FFF  hi-res page 1        $4000-$5FFF  hi-res page 2
#   $6000-$7FFF  the background copy
#   $8000-$A3FF  the movie, 9,216 bytes at most
#   $A400-$BEFF  the command kept for the way on (CMDBUF, first: under
#                $BB00), then the program; $BB00-$BEFF is the return
#                thunk's I/O buffer once the program has stopped
#   $BF00        ProDOS global page, untouched
MEMORY {
    ZP:   file = "", start = $0060, size = $0080, type = rw;
    FILE: file = %O, start = $2000, size = $6000;
    RUN:  file = "", start = $A400, size = $1B00;
    LOW:  file = "", start = $0C00, size = $1400, type = rw;
    IOB:  file = "", start = $0800, size = $0400, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    LOADER:   load = FILE, type = ro;
    CMDBUF:   load = RUN,  type = bss, define = yes;
    CODE:     load = FILE, run = RUN, type = ro, define = yes;
    RODATA:   load = FILE, run = RUN, type = ro, define = yes;
    BSS:      load = LOW,  type = bss, define = yes;
    TABLES:   load = FILE, run = LOW, type = ro, define = yes;
    FCOLD:    load = FILE, run = LOW, type = ro, define = yes;
    EBSS:     load = IOB,  type = bss;
}
