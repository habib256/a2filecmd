# A2FC Mini DOS 3.3, pure 6502, for a 48 KB Apple II+.
#
#   $0200-$03CF  format.s at run time: DOS's input buffer and free page three
#   $0800-$0FFF  the Applesoft HELLO that BRUNs us, left untouched
#   $1000-$1FFF  editor and delete: they do not run with a copy or a picture
#   $2000-$3FFF  hi-res page one: the shared 8 KB working area
#   $4000-$95FF  resident program: catalog, copy, panels, BSS
#   $9600 upward DOS 3.3's file buffers and DOS itself
#
# BRUN loads one contiguous image from $1000 so that MAIN lands at $4000.
# The eight kilobytes between LOW and MAIN are the working area. In the
# file they carry two things that must not stay there: the format module,
# which lowstart.s copies to $0200 before anything else, and the splash,
# which runs once at start before the working area has an owner. The
# rest is zeros.

MEMORY {
    LOW:   file = %O, start = $1000, size = $1000, fill = yes, fillval = 0;
    HGR:   file = %O, start = $2000, size = $2000, fill = yes, fillval = 0;
    MAIN:  file = %O, start = $4000, size = $5600, define = yes;
    PAGES: file = "", start = $0200, size = $01D0;
}
SEGMENTS {
    LOWSTART: load = LOW,  type = ro;
    LOWCODE:  load = LOW,  type = ro;
    FORMAT:   load = HGR,  run = PAGES, type = ro, define = yes;
    INIT:     load = HGR,  type = ro;
    STARTUP:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
}
