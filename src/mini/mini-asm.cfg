# A2FC Mini DOS 3.3, pure 6502, for a 48 KB Apple II+.
#
#   $0800-$1FFF  the Applesoft HELLO that BRUNs us
#   $2000-$7FFF  this program: code, then read-only data, then BSS
#   $8000 upward DOS 3.3, its file buffers and RWTS
#
# No language card, no auxiliary bank, no overlays, and no software
# stack: the hardware stack in page one is the only one. STARTUP comes
# first so that the load address $2000 is also the entry point BRUN jumps
# to. BSS carries define = yes because start.s clears it before use.
MEMORY {
    MAIN: file = %O, start = $2000, size = $6000, define = yes;
}
SEGMENTS {
    STARTUP: load = MAIN, type = ro;
    CODE:    load = MAIN, type = ro;
    RODATA:  load = MAIN, type = ro;
    DATA:    load = MAIN, type = rw;
    BSS:     load = MAIN, type = bss, define = yes;
}
