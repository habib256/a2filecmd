# Link configuration of A2 File Cmd.
#
# The game keeps the main BSS at the end of the window ($4000-__HIMEM__)
# because the heap follows it. A2FC has no heap: it links NEITHER malloc NOR
# free (the apple2enh-iobuf-0800 module hands out the ProDOS buffers from
# $0800, and nothing else allocates -- checked in a2fc.map). The BSS can
# therefore move down into low RAM with LOWBSS, which gives back to the main
# window the 88 bytes it took just below the C stack.
#
# Above all, this escapes the trap documented in the Makefile: the size of
# the BSS area is written __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__, and when
# the code grows enough to make it negative, ld65 reads it as an unsigned
# integer, reports nothing, and puts the BSS in the middle of the C stack.
# The link succeeds and the program corrupts itself in use. Here the BSS
# area no longer exists.
#
# ONE limit remains to be held by hand, which the linker does not check
# either: CODE + RODATA + DATA + INIT must end below the floor of the C
# stack (__HIMEM__ - __STACKSIZE__). Only ONCE may cross it: it is dead
# before main() begins. tools/check_layout.py checks this.
#
# IMAGE: the overlay window, $1B00-$1FFF, 1,280 bytes of low RAM.
#
# The launcher stages the file's prefix at $1000 before crt0 copies the LC
# image to $D400; that prefix is 3 KB and ends at $1BFF. Once the image has
# been carried away, everything from the end of LOWRAM to $2000, where the
# graphics page begins, is free. No resident code lives there any more: it
# is the window into which A2FC loads, when opening a file, the module that
# knows how to read it -- the image loader and decoder (IMAGE), the text
# (TEXT) and hexadecimal (HEX) viewers, deletion (DELETE), the help page
# (HELP) -- and which it forgets when returning to the panels. Each module
# is LINKED with the program (it calls fopen, memcpy, view_getc like any
# other function), but the linker writes it to a separate file, %O.NAME,
# which the floppy carries as A2FILE/NAME.PLG. The areas overlap: only one
# overlay is in place at a time. Its first two bytes are the address of
# main: the core uses them to recognise an overlay from another build and
# refuse to launch it.
#
# This is what gave room back to the main window, which runs up against
# the C stack, while the language card is full to within some twenty bytes:
# the core knows how to recognise and load, it no longer knows how to decode.

# LOWRAM: $1000-$1AFF, between the ProDOS I/O buffer and the overlay window.
# The program loads at $4000; this area was free and the linker ignored it.
# The BSS of a2fc.c lives there (panels, paths, copy buffer, text page
# starts), and since a2fc.cfg the main cc65 BSS with it. It ends at $1AFF
# and not at $1FFF: the overlay comes above, and bounding the area here is
# the only way to make the linker refuse a BSS that would overwrite it.
#
# Two rules not to forget:
#  - crt0 only zeroes the BSS segment; main() clears LOWBSS itself with
#    __LOWBSS_RUN__ / __LOWBSS_SIZE__ (define = yes);
#  - the main BSS moves down here, unlike in the game, because A2FC has no
#    heap to make follow it (see the header). If a malloc ever entered A2FC,
#    it would have to move back up: the heap follows __BSS_RUN__ +
#    __BSS_SIZE__ and would run straight into the graphics page.
#
# MAPRAM: $0C00-$0FFF. The game keeps the MAP menu data there; A2FC does
#    not use MAPBSS and leaves that kilobyte to iobuf-0800, which puts the
#    ProDOS buffer of the SECOND open file there -- a copy opens two.
FEATURES {
    STARTADDRESS: default = $4000;
}
SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $0006; # ProDOS file type
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $9600; # Presumed RAM end
    __LCADDR__:    type = weak, value = $D400; # Behind quit code
    __LCSIZE__:    type = weak, value = $0C00; # Rest of bank two
    __BIN2SIZE__:  type = weak, value = $0500; # BINARY2: small, or big ($0D00) on 6502
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,        size = $001A;
    HEADER: file = %O,               start = %S - $003A,   size = $003A;
    MAPRAM: file = "", define = yes, start = $0C00,        size = $0400;
    LOWRAM: file = "", define = yes, start = $1000,        size = $0B00;
    LCIMAGE: file = %O, define = yes, start = $1000, size = $0C00, fill = yes;
    IMAGE:  file = "%O.IMAGE", define = yes, start = $1B00, size = $0500;
    HELP:   file = "%O.HELP",  define = yes, start = $1B00, size = $0500;
    TEXT:   file = "%O.TEXT",  define = yes, start = $1B00, size = $0500;
    BASLIST: file = "%O.BASLIST", define = yes, start = $1B00, size = $0D00;
    COMPARE: file = "%O.COMPARE", define = yes, start = $1B00, size = $0500;
    SEARCH:  file = "%O.SEARCH",  define = yes, start = $1B00, size = $0500;
    BINARY2: file = "%O.BINARY2", define = yes, start = $1B00, size = __BIN2SIZE__;
    AWP: file = "%O.AWP", define = yes, start = $1B00, size = $0500;
    HEX:    file = "%O.HEX",   define = yes, start = $1B00, size = $0500;
    DELETE: file = "%O.DELETE", define = yes, start = $1B00, size = $0500;
    MUSIC:  file = "%O.MUSIC", define = yes, start = $1B00, size = $0500;
    RUN:    file = "%O.RUN",   define = yes, start = $1B00, size = $0500;
    ATTR:   file = "%O.ATTR",  define = yes, start = $1B00, size = $0500;
    # The big overlays, reaching into the graphics page: the editor keeps
    # $2800-$3FFF for the text, the menu $3000-$3FFF for its list.
    EDIT:   file = "%O.EDIT",  define = yes, start = $1B00, size = $0D00;
    MENU:   file = "%O.MENU",  define = yes, start = $1B00, size = $1500;
    DISKIMG: file = "%O.DISKIMG", define = yes, start = $1B00, size = $1900;
    IMGFS:  file = "%O.IMGFS", define = yes, start = $1B00, size = $0500;
    DOS33:  file = "%O.DOS33", define = yes, start = $1B00, size = $0500;
    # UNSHRINK: big overlay, LZW core in assembly at the head ($1B00-$1FFF,
    # copied to AUX at the same address), C driver next, up to $2FFF.
    UNSHRINK: file = "%O.UNSHRINK", define = yes, start = $1B00, size = $1500;
    FORMAT: file = "%O.FORMAT", define = yes, start = $1B00, size = $2100;
    FORMATSTATE: file = "", start = $3C00, size = $0200;
    MAIN:   file = %O, define = yes, start = %S,           size = __HIMEM__ - %S;
    LC:     file = "", define = yes, start = __LCADDR__,   size = __LCSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    LC:       load = LCIMAGE, run = LC, type = ro, optional = yes;
    BSS:      load = LOWRAM,         type = bss, define   = yes;
    FORMAT: load = FORMAT, type = ro, align = $100;
    FORMATRO: load = FORMAT, type = ro;
    FORMATBSS: load = FORMATSTATE, type = bss, define = yes;
    IMAGE:    load = IMAGE,          type = ro,  optional = yes;
    IMAGERO:  load = IMAGE,         type = ro,  optional = yes;
    HELP:     load = HELP,           type = ro,  optional = yes;
    HELPRO:   load = HELP,          type = ro,  optional = yes;
    TEXT:     load = TEXT,           type = ro,  optional = yes;
    TEXTRO:   load = TEXT,          type = ro,  optional = yes;
    BASLIST:  load = BASLIST,        type = ro,  optional = yes;
    BASLISTRO: load = BASLIST,      type = ro,  optional = yes;
    COMPARE:  load = COMPARE,        type = ro,  optional = yes;
    COMPARERO: load = COMPARE,      type = ro,  optional = yes;
    SEARCH:   load = SEARCH,         type = ro,  optional = yes;
    SEARCHRO: load = SEARCH,        type = ro,  optional = yes;
    BINARY2:  load = BINARY2,        type = ro,  optional = yes;
    BINARY2RO: load = BINARY2,      type = ro,  optional = yes;
    AWP:      load = AWP,            type = ro,  optional = yes;
    AWPRO:    load = AWP,            type = ro,  optional = yes;
    HEX:      load = HEX,            type = ro,  optional = yes;
    HEXRO:    load = HEX,           type = ro,  optional = yes;
    DELETE:   load = DELETE,         type = ro,  optional = yes;
    DELETERO: load = DELETE,        type = ro,  optional = yes;
    MUSIC:    load = MUSIC,          type = ro,  optional = yes;
    MUSICRO:  load = MUSIC,         type = ro,  optional = yes;
    RUN:      load = RUN,            type = ro,  optional = yes;
    RUNRO:    load = RUN,           type = ro,  optional = yes;
    ATTR:     load = ATTR,           type = ro,  optional = yes;
    ATTRRO:   load = ATTR,          type = ro,  optional = yes;
    EDIT:     load = EDIT,           type = ro,  optional = yes;
    EDITRO:   load = EDIT,          type = ro,  optional = yes;
    MENU:     load = MENU,           type = ro,  optional = yes;
    MENURO:   load = MENU,          type = ro,  optional = yes;
    DISKIMG:  load = DISKIMG,        type = ro,  optional = yes;
    IMGFS:    load = IMGFS,          type = ro,  optional = yes;
    IMGFSRO:  load = IMGFS,          type = ro,  optional = yes;
    DOS33:    load = DOS33,          type = ro,  optional = yes;
    DOS33RO:  load = DOS33,          type = ro,  optional = yes;
    UNSHRINK: load = UNSHRINK,       type = ro,  optional = yes;
    UNSHRINKRO: load = UNSHRINK,    type = ro,  optional = yes;
    DISKIMGRO: load = DISKIMG,       type = ro,  optional = yes;
    LOWBSS:   load = LOWRAM,         type = bss, define   = yes, optional = yes;
    MAPBSS:   load = MAPRAM,         type = bss, define   = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
