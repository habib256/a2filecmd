# Configuration de lien d'A2 File Cmd.
#
# Le jeu garde la BSS principale en fin de fenetre ($4000-__HIMEM__) parce
# que le tas la suit. A2FC n'a pas de tas : il ne lie NI malloc NI free (le
# module apple2enh-iobuf-0800 distribue les tampons ProDOS depuis $0800, et
# rien d'autre n'alloue -- verifie dans a2fc.map). La BSS peut donc
# descendre en RAM basse avec LOWBSS, ce qui rend a la fenetre principale les
# 88 octets qu'elle prenait juste sous la pile C.
#
# Et surtout, cela sort du piege documente dans le Makefile : la taille de la
# zone BSS s'ecrit __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__, et quand le code
# grossit assez pour la rendre negative, ld65 la lit en entier non signe,
# ne signale rien, et pose la BSS au milieu de la pile C. Le lien reussit et
# le programme se corrompt a l'usage. Ici la zone BSS n'existe plus.
#
# Reste UNE limite a tenir a la main, que le lieur ne verifie pas non plus :
# CODE + RODATA + DATA + INIT doivent finir sous le plancher de la pile C
# (__HIMEM__ - __STACKSIZE__). Seul ONCE a le droit de la depasser, il est
# mort avant que main() ne commence. tools/check_layout.py le controle.
#
# IMAGE : la fenetre de surcouche, $1B00-$1FFF, 1 280 octets de RAM basse.
#
# Le lanceur met en scene le prefixe du fichier en $1000 avant que crt0 ne
# recopie l'image LC en $D400 ; ce prefixe fait 3 Ko et s'arrete a $1BFF.
# Une fois l'image emportee, tout ce qui va de la fin de LOWRAM a $2000, ou
# commence la page graphique, est libre. On n'y loge plus de code resident :
# c'est la fenetre ou A2FC charge, au moment d'ouvrir un fichier, le module
# qui sait le lire -- le chargeur et le decodeur d'images (IMAGE), les
# visionneuses de texte (TEXT) et d'hexadecimal (HEX), la suppression
# (DELETE), la page d'aide (HELP) -- et qu'il oublie en revenant aux
# panneaux. Chaque module est LIE avec le programme (il appelle fopen,
# memcpy, view_getc comme n'importe quelle fonction), mais le lieur l'ecrit
# dans un fichier a part, %O.NOM, que la disquette porte sous
# A2FILE/NOM.PLG. Les zones se recouvrent : une seule surcouche est en
# place a la fois. Ses deux premiers octets sont l'adresse de main : le noyau s'en
# sert pour reconnaitre une surcouche d'une autre construction et refuser de
# la lancer.
#
# C'est ce qui a rendu de la place a la fenetre principale, qui bute sur la
# pile C, alors que la carte langage est pleine a une vingtaine d'octets
# pres : le noyau sait reconnaitre et charger, il ne sait plus decoder.

# LOWRAM : $1000-$1AFF, entre le tampon d'E/S ProDOS et la fenetre de
# surcouche. Le programme charge en $4000 ; cette zone etait libre et le
# lieur l'ignorait. La BSS de a2fc.c y vit (panneaux, chemins, tampon de
# copie, debuts de page du texte), et depuis a2fc.cfg la BSS principale de
# cc65 avec elle. Elle s'arrete a $1AFF et non a $1FFF : au-dessus vient la
# surcouche, et borner la zone ici est la seule facon de faire refuser au
# lieur une BSS qui viendrait l'ecraser.
#
# Deux regles a ne pas oublier :
#  - crt0 ne met a zero que le segment BSS ; main() efface LOWBSS lui-meme
#    avec __LOWBSS_RUN__ / __LOWBSS_SIZE__ (define = yes) ;
#  - la BSS principale descend ici, contrairement au jeu, parce que A2FC
#    n'a pas de tas a lui faire suivre (voir l'en-tete). Si un malloc entrait
#    un jour dans A2FC, il faudrait la remonter : le tas suit
#    __BSS_RUN__ + __BSS_SIZE__ et partirait droit dans la page graphique.
#
# MAPRAM : $0C00-$0FFF. Le jeu y loge les donnees du menu MAP ; A2FC
#    n'utilise pas MAPBSS et laisse ce kilo-octet a iobuf-0800, qui y met le
#    tampon ProDOS du SECOND fichier ouvert -- une copie en ouvre deux.
FEATURES {
    STARTADDRESS: default = $4000;
}
SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $0006; # ProDOS file type
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $9600; # Presumed RAM end
    __LCADDR__:    type = weak, value = $D400; # Behind quit code
    __LCSIZE__:    type = weak, value = $0C00; # Rest of bank two
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,        size = $001A;
    HEADER: file = %O,               start = %S - $003A,   size = $003A;
    MAPRAM: file = "", define = yes, start = $0C00,        size = $0400;
    LOWRAM: file = "", define = yes, start = $1000,        size = $0B00;
    LCIMAGE: file = %O, define = yes, start = $1000, size = $0C00, fill = yes;
    IMAGE:  file = "%O.IMAGE", define = yes, start = $1B00, size = $0500;
    HELP:   file = "%O.HELP",  define = yes, start = $1B00, size = $0500;
    TEXT:   file = "%O.TEXT",  define = yes, start = $1B00, size = $0500;
    HEX:    file = "%O.HEX",   define = yes, start = $1B00, size = $0500;
    DELETE: file = "%O.DELETE", define = yes, start = $1B00, size = $0500;
    MUSIC:  file = "%O.MUSIC", define = yes, start = $1B00, size = $0500;
    RUN:    file = "%O.RUN",   define = yes, start = $1B00, size = $0500;
    ATTR:   file = "%O.ATTR",  define = yes, start = $1B00, size = $0500;
    # Les grandes surcouches, jusque dans la page graphique : l'editeur garde
    # $2800-$3FFF pour le texte, le menu $3000-$3FFF pour sa liste.
    EDIT:   file = "%O.EDIT",  define = yes, start = $1B00, size = $0D00;
    MENU:   file = "%O.MENU",  define = yes, start = $1B00, size = $1500;
    DISKIMG: file = "%O.DISKIMG", define = yes, start = $1B00, size = $1900;
    IMGFS:  file = "%O.IMGFS", define = yes, start = $1B00, size = $0500;
    DOS33:  file = "%O.DOS33", define = yes, start = $1B00, size = $0500;
    MAIN:   file = %O, define = yes, start = %S,           size = __HIMEM__ - %S;
    LC:     file = "", define = yes, start = __LCADDR__,   size = __LCSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    LC:       load = LCIMAGE, run = LC, type = ro, optional = yes;
    BSS:      load = LOWRAM,         type = bss, define   = yes;
    IMAGE:    load = IMAGE,          type = ro,  optional = yes;
    IMAGERO:  load = IMAGE,         type = ro,  optional = yes;
    HELP:     load = HELP,           type = ro,  optional = yes;
    HELPRO:   load = HELP,          type = ro,  optional = yes;
    TEXT:     load = TEXT,           type = ro,  optional = yes;
    TEXTRO:   load = TEXT,          type = ro,  optional = yes;
    HEX:      load = HEX,            type = ro,  optional = yes;
    HEXRO:    load = HEX,           type = ro,  optional = yes;
    DELETE:   load = DELETE,         type = ro,  optional = yes;
    DELETERO: load = DELETE,        type = ro,  optional = yes;
    MUSIC:    load = MUSIC,          type = ro,  optional = yes;
    MUSICRO:  load = MUSIC,         type = ro,  optional = yes;
    RUN:      load = RUN,            type = ro,  optional = yes;
    RUNRO:    load = RUN,           type = ro,  optional = yes;
    ATTR:     load = ATTR,           type = ro,  optional = yes;
    ATTRRO:   load = ATTR,          type = ro,  optional = yes;
    EDIT:     load = EDIT,           type = ro,  optional = yes;
    EDITRO:   load = EDIT,          type = ro,  optional = yes;
    MENU:     load = MENU,           type = ro,  optional = yes;
    MENURO:   load = MENU,          type = ro,  optional = yes;
    DISKIMG:  load = DISKIMG,        type = ro,  optional = yes;
    IMGFS:    load = IMGFS,          type = ro,  optional = yes;
    IMGFSRO:  load = IMGFS,          type = ro,  optional = yes;
    DOS33:    load = DOS33,          type = ro,  optional = yes;
    DOS33RO:  load = DOS33,          type = ro,  optional = yes;
    DISKIMGRO: load = DISKIMG,       type = ro,  optional = yes;
    LOWBSS:   load = LOWRAM,         type = bss, define   = yes, optional = yes;
    MAPBSS:   load = MAPRAM,         type = bss, define   = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
