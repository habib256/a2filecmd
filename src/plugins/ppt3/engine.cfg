# The GROUiK engine image: AUX $2000, header first; its variables and the
# tables INIT builds follow in PPT3BSS (not in the file), all below $3B00
# (PPT3_LIMIT in abi.inc: the trampoline's mirror page follows). ld65
# refuses an image that would cross it.
MEMORY {
    AUX:    file = %O, start = $2000, size = $1B00;
}
SEGMENTS {
    PPT3HDR: load = AUX, type = ro;
    CODE:    load = AUX, type = ro;
    PPT3END: load = AUX, type = ro, optional = yes;
    PPT3BSS: load = AUX, type = bss, define = yes;
}
